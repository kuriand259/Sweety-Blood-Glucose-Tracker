services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5435:5432"
    volumes:
      - sweety_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    ports:
      - "4100:4100"
    environment:
      DATABASE_URL: postgresql://sweety:sweety@postgres:5432/sweety?schema=public
      JWT_SECRET: dev-sweety-jwt-secret-change-me
      PORT: "4100"
      APP_TIMEZONE: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4100
    depends_on:
      server:
        condition: service_healthy

volumes:
  sweety_pg:
